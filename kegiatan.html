<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="icon pmkn.jpeg" type="image/png" />
    <title>Error | PMKN Tondano</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
    <style>
    .bsod-shard {
  position: fixed;
  background-color: #0078d7; /* Warna khas Windows BSOD */
  color: white;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  padding: 20px;
  z-index: 2147483646;
  pointer-events: none;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  overflow: hidden;
  animation: bsodGlitch 0.2s steps(2) infinite;
}

@keyframes bsodGlitch {
  0% { transform: skewX(0deg); filter: hue-rotate(0deg); }
  50% { transform: skewX(10deg); filter: hue-rotate(90deg); }
  100% { transform: skewX(-5deg); }
}
        /* Tambahkan efek teks berjalan di background */
  .fake-log-line {
    position: fixed;
    color: rgba(225, 29, 72, 0.4);
    font-family: monospace;
    font-size: 12px;
    white-space: nowrap;
    z-index: 999997;
    pointer-events: none;
    animation: moveLog 3s linear infinite;
  }

  @keyframes moveLog {
    from { transform: translateY(100vh); }
    to { transform: translateY(-100px); }
  }

  /* Animasi stiker liar (Teleportasi) */
  @keyframes pmknWildGlitch {
    0%, 100% { transform: translate(0, 0) scale(1); }
    10% { transform: translate(-100px, 50px) scale(1.2); filter: hue-rotate(90deg); }
    20% { transform: translate(150px, -80px) rotate(5deg); }
    30% { transform: translate(-200px, -150px) scale(0.8); opacity: 0; }
    31% { opacity: 1; }
    40% { transform: translate(100px, 100px) rotate(-10deg); }
    50% { transform: translate(0, 0) scale(1.5); }
  }

  /* Layar berguncang keras saat error */
  .shake-screen {
    animation: hardShake 0.1s infinite;
  }

  @keyframes hardShake {
    0% { transform: translate(0,0); }
    25% { transform: translate(5px, 5px); }
    50% { transform: translate(-5px, -5px); }
    75% { transform: translate(5px, -5px); }
    100% { transform: translate(-5px, 5px); }
  }
      body {
        margin: 0;
        padding: 0;
      }
      .pmkn-greet-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        /* Background dibuat lebih gelap dan mencekam */
        background: black; 
        z-index: 999999;
        display: none;
        justify-content: center;
        align-items: center;
        font-family: "Plus Jakarta Sans", sans-serif;
        text-align: center;
        color: #f8fafc;
        overflow: hidden;
      }

      /* Animasi guncangan untuk kontainer agar user panik */
      .pmkn-greet-container {
        max-width: 600px;
        width: 90%;
        animation: pmknEnter 1.2s forwards, pmknPanicShake 0.1s infinite;
      }

      @keyframes pmknPanicShake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        20% { transform: translate(-1px, -2px) rotate(-0.5deg); }
        40% { transform: translate(-3px, 0px) rotate(0.5deg); }
        60% { transform: translate(3px, 2px) rotate(0deg); }
        80% { transform: translate(1px, -1px) rotate(0.5deg); }
        100% { transform: translate(-1px, 2px) rotate(-0.5deg); }
      }

      /* Efek Gabungan Stiker: Melayang + Glitch + Lompat Liar */
.pmkn-stk-wrapper {
  position: relative;
  display: inline-block;
  width: clamp(150px, 25vw, 220px);
  margin-bottom: 30px;
  /* Kita gabungkan animasi float dan wild glitch agar lebih ekstrem */
  animation: pmknFloatModern 5s ease-in-out infinite, stikerHancur 0.15s infinite;
  z-index: 1000001; /* Pastikan di atas log berjalan */
}

/* Teks Log Berjalan (Redefined for clarity) */
.fake-log-line {
  position: fixed;
  color: #e11d48;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
  z-index: 1000000;
  pointer-events: none;
  text-shadow: 0 0 5px #ff0000;
  /* Pastikan hanya menggunakan satu animasi Rise agar tidak tabrakan */
  animation: logRise 2s linear forwards; 
}
      .pmkn-greet-stk-img {
        width: 100%;
        height: auto;
        /* Warna merah error tetap dipertahankan */
        filter: grayscale(1) brightness(0.5) sepia(1) hue-rotate(-50deg)
          saturate(10) drop-shadow(0 0 20px rgba(225, 29, 72, 0.8));
        border-radius: 20px;
        position: relative;
        /* Menjalankan animasi glitch dan pulse secara bersamaan */
        animation: pmknHackerGlitch 0.4s infinite, pmknErrorPulse 2s infinite;
      }

      /* Animasi Glitch: Membuat stiker geser-geser dan hilang-muncul */
      @keyframes pmknHackerGlitch {
        0% {
          transform: translate(0);
          opacity: 1;
          clip-path: inset(0 0 0 0);
        }
        10% {
          transform: translate(-5px, -2px);
          opacity: 0.8;
          clip-path: inset(10% 0 30% 0); /* Memotong gambar secara horizontal */
        }
        20% {
          transform: translate(5px, 2px);
          opacity: 1;
          clip-path: inset(40% 0 10% 0);
        }
        30% {
          transform: translate(-2px, 5px);
          opacity: 0.3; /* Efek hilang sejenak */
        }
        40% {
          transform: translate(8px, -5px);
          opacity: 1;
          clip-path: inset(0 0 50% 0);
        }
        50% {
          transform: translate(-8px, 2px);
          clip-path: inset(80% 0 0 0);
        }
        52% {
          transform: translate(0);
          opacity: 1;
          clip-path: inset(0 0 0 0);
        }
        100% {
          transform: translate(0);
          opacity: 1;
        }
      }

      @keyframes pmknErrorPulse {
        0%, 100% {
          filter: grayscale(1) brightness(0.6) sepia(1) hue-rotate(-50deg) saturate(10) drop-shadow(0 0 20px rgba(225, 29, 72, 0.8));
        }
        50% {
          filter: grayscale(1) brightness(0.9) sepia(1) hue-rotate(-50deg) saturate(15) drop-shadow(0 0 40px rgba(225, 29, 72, 1));
        }
      }

      /* Log teks melayang di seluruh layar */
.fake-log-line {
  position: fixed;
  color: #e11d48;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
  z-index: 1000000; /* Di atas segalanya */
  pointer-events: none;
  text-shadow: 0 0 5px #ff0000;
  animation: logRise linear forwards;
}

@keyframes logRise {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}

/* Efek Shake Layar */
.shake-screen {
  animation: screenPanik 0.1s infinite;
}

@keyframes screenPanik {
  0% { transform: translate(0,0); }
  50% { transform: translate(-8px, 4px) rotate(0.2deg); }
  100% { transform: translate(8px, -4px); }
}

/* Stiker Glitch Ekstrim */
.pmkn-stk-wrapper {
  animation: stikerHancur 0.15s infinite;
}

@keyframes stikerHancur {
  0% { transform: translate(0,0) scale(1); filter: invert(0); }
  20% { transform: translate(-200px, 100px) scale(1.5); filter: invert(1); }
  40% { transform: translate(250px, -150px) rotate(10deg); }
  60% { transform: translate(-300px, -200px) skewX(20deg); opacity: 0.5; }
  80% { transform: translate(150px, 200px); filter: hue-rotate(180deg); }
  100% { transform: translate(0,0); }
}

      #pmkn-greet-msg-title {
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 800;
        margin: 0;
        color: #e11d48;
        letter-spacing: -1px;
        text-shadow: 2px 0 #00ffff, -2px 0 #ff00ff; /* Efek chromatic aberration */
        font-family: 'Courier New', Courier, monospace; /* Gaya font terminal */
        text-transform: uppercase;
        }

      #pmkn-greet-msg-desc {
        font-size: 1.1rem;
        color: #94a3b8;
        margin: 15px auto 40px;
        max-width: 450px;
        line-height: 1.5;
      }
      .pmkn-greet-btn {
        background: transparent;
        color: #38bdf8;
        border: none;
        padding: 10px 20px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: underline;
        text-underline-offset: 6px;
        font-family: monospace;
      }
      .pmkn-greet-btn:hover {
        color: #f8fafc;
        transform: translateY(-2px);
      }
      @keyframes pmknEnter {
        0% {
          opacity: 0;
          transform: scale(0.9) translateY(20px);
          filter: blur(10px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: blur(0);
        }
      }
      @keyframes pmknFloatModern {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-15px) rotate(1deg);
        }
      }
      .pmkn-tear-puddle {
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 70%;
        height: 8px;
        background: rgba(225, 29, 72, 0.2);
        border-radius: 50%;
        filter: blur(4px);
      }
      @keyframes pmknErrorPulse {
        0%,
        100% {
          filter: grayscale(1) brightness(0.5) sepia(1) hue-rotate(-50deg)
            saturate(10) drop-shadow(0 0 20px rgba(225, 29, 72, 0.8));
        }
        50% {
          filter: grayscale(1) brightness(0.7) sepia(1) hue-rotate(-50deg)
            saturate(15) drop-shadow(0 0 35px rgba(225, 29, 72, 1));
        }
      }
      .locked-critical {
        cursor: none !important; /* Hilangkan kursor */
        user-select: none; /* Cegah copy-paste */
        overflow: hidden;
        }
    </style>
  </head>
  <body>
    <canvas id="matrix-canvas" style="position:fixed; top:0; left:0; z-index:999998; pointer-events:none; opacity:0.3;"></canvas>
    <div id="pmkn-greet-overlay" class="pmkn-greet-layer">
      <div class="pmkn-greet-container">
        <div id="pmkn-step-1">
          <div class="pmkn-stk-wrapper">
            <img src="lelahstk.png" alt="Sticker" class="pmkn-greet-stk-img" />
            <div class="pmkn-tear-puddle"></div>
          </div>
          <h1 id="pmkn-greet-msg-title">Error 404</h1>
          <p id="pmkn-greet-msg-desc">
            Sistem mendeteksi aktivitas timeout. Keberadaan Anda tidak ditemukan
            di server kami.
          </p>
        </div>
      </div>
    <div id="pmkn-greet-overlay" class="pmkn-greet-layer">
      <div class="pmkn-greet-container">
        <div id="pmkn-step-1">
          <div class="pmkn-stk-wrapper">
            <img src="lelahstk.png" alt="Sticker" class="pmkn-greet-stk-img" />
            <div class="pmkn-tear-puddle"></div>
          </div>
          <h1 id="pmkn-greet-msg-title">Error 404</h1>
          <p id="pmkn-greet-msg-desc">
            Sistem mendeteksi aktivitas timeout. Keberadaan Anda tidak ditemukan
            di server kami.
          </p>
          <button onclick="pmknUnlockSystem()" class="pmkn-greet-btn">
            &gt; RUN_SYSTEM_REBOOT.exe
          </button>
        </div>
      </div>
    </div>
    <script>
  const pmknMessages = [
    { t: "CRITICAL_BREACH", d: "Unauthorized access detected. System firewall bypassed. Your session ID blacklisted." },
    { t: "KERNEL_PANIC", d: "Fatal instruction at 0x0045F. System unstable. Memory dump initiated... DO NOT EXIT." },
    { t: "OVERWRITE_ALERT", d: "External script overwriting local database. Identity sync failed. Files encrypted." },
    { t: "REMOTE_HIJACK", d: "Connection hijacked. Proxy detected. Server heartbeat: TERMINATED. Access denied." },
    { t: "SYSTEM_WIPE", d: "Warning! Malicious activity. Directory permissions revoked. Purging local data..." }
  ];

  let isLocked = false;
  let logInterval, matrixInterval;
  let bsodInterval;

function createBSODShards() {
  const technicalErrors = [
    ":( Your PC ran into a problem",
    "STOP CODE: WHEA_UNCORRECTABLE_ERROR",
    "CRITICAL_PROCESS_DIED",
    "0x0000001E - KMODE_EXCEPTION_NOT_HANDLED",
    "DUMPING PHYSICAL MEMORY..."
  ];

  bsodInterval = setInterval(() => {
    const shard = document.createElement('div');
    shard.className = 'bsod-shard';
    
    // Ukuran acak agar terlihat seperti pecahan layar
    const width = Math.random() * 400 + 200;
    const height = Math.random() * 200 + 100;
    
    shard.style.width = width + 'px';
    shard.style.height = height + 'px';
    shard.style.top = Math.random() * 80 + 'vh';
    shard.style.left = Math.random() * 70 + 'vw';
    
    shard.innerHTML = `
      <h1 style="font-size: 40px; margin: 0;">:(</h1>
      <p style="font-size: 14px;">${technicalErrors[Math.floor(Math.random() * technicalErrors.length)]}</p>
      <div style="width: 50px; height: 50px; border: 4px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    `;

    document.body.appendChild(shard);

    // Hilang dengan cepat untuk efek flicker
    setTimeout(() => shard.remove(), Math.random() * 800 + 200);
  }, 1500); // Muncul setiap 1.5 detik sekali secara bergantian
}

  function createFakeLogs() {
    const logs = [
      "DELETING_SYSTEM_32...", "UPLOADING_PRIVATE_KEYS...", "EXTRACTING_BROWSER_HISTORY...",
      "BYPASSING_LOCAL_IP...", "ENCRYPTING_DISK_C...", "CONTACTING_C&C_SERVER...",
      "WIPING_BOOT_SECTOR...", "UNAUTHORIZED_ROOT_ACCESS...", "INJECTING_TROJAN.EXE...",
      "STEALING_COOKIES...", "LOCATING_PHYSICAL_ADDRESS..."
    ];
    
    // Simpan interval agar bisa dihentikan saat unlock
    logInterval = setInterval(() => {
      const log = document.createElement('div');
      log.className = 'fake-log-line';
      log.style.left = Math.random() * 90 + 'vw';
      log.style.animationDuration = (Math.random() * 1 + 0.5) + 's'; // Lebih cepat
      log.innerText = logs[Math.floor(Math.random() * logs.length)];
      document.body.appendChild(log);
      setTimeout(() => log.remove(), 2000);
    }, 80); 
  }

  function startHackerEffect() {
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = 'アァカサタナハマヤャラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const rainDrops = Array(Math.floor(columns)).fill(1);

    const draw = () => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#e11d48';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < rainDrops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
        rainDrops[i]++;
      }
    };
    matrixInterval = setInterval(draw, 30);
  }

  function showLockScreen(overlay) {
    if (isLocked) return; // Mencegah duplikasi efek
    isLocked = true;
    localStorage.setItem("pmkn_pending_lock", "true");
    
    startHackerEffect();
    createFakeLogs();
    document.body.classList.add('shake-screen');

    const pick = pmknMessages[Math.floor(Math.random() * pmknMessages.length)];
    document.getElementById("pmkn-greet-msg-title").innerText = pick.t;
    document.getElementById("pmkn-greet-msg-desc").innerText = pick.d;

    if (overlay) overlay.style.display = "flex";
    lockNavigation();
  }

  function pmknUnlockSystem() {
    const overlay = document.getElementById("pmkn-greet-overlay");
    isLocked = false;
    localStorage.setItem("pmkn_pending_lock", "false");
    window.onbeforeunload = null;

    // Hentikan semua kegilaan
    clearInterval(logInterval);
    clearInterval(matrixInterval);
    document.body.classList.remove('shake-screen');
    document.querySelectorAll('.fake-log-line').forEach(l => l.remove());

    if (overlay) {
      overlay.style.transition = "opacity 0.5s ease";
      overlay.style.opacity = "0";
      setTimeout(() => {
        overlay.style.display = "none";
        overlay.style.opacity = "1";
        // Bersihkan canvas
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }, 500);
    }
    localStorage.setItem("pmkn_v3_last_seen", new Date().getTime());
  }

  function lockNavigation() {
    window.onbeforeunload = () => isLocked ? "SYSTEM CRITICAL: DATA LOSS IMMINENT!" : null;
  }

  function handlePmknReunionLogic() {
    const now = new Date().getTime();
    const lastSeen = localStorage.getItem("pmkn_v3_last_seen");
    const wasPending = localStorage.getItem("pmkn_pending_lock") === "true";
    const overlay = document.getElementById("pmkn-greet-overlay");

    if (lastSeen) {
      const timeGap = now - parseInt(lastSeen);
      if (timeGap > 1000 || wasPending) showLockScreen(overlay);
    }
    localStorage.setItem("pmkn_v3_last_seen", now);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && isLocked) pmknUnlockSystem();
  });

  window.addEventListener("load", handlePmknReunionLogic);
  function showLockScreen(overlay) {
    if (isLocked) return;
    isLocked = true;
    
    // 1. Aktifkan Fullscreen (Opsional: Butuh interaksi user pada beberapa browser)
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
    }

    // 2. Tambahkan class lock ke body (Hilangkan kursor & scroll)
    document.body.classList.add('locked-critical');
    
    startHackerEffect();
    createFakeLogs();
    document.body.classList.add('shake-screen');

    const pick = pmknMessages[Math.floor(Math.random() * pmknMessages.length)];
    document.getElementById("pmkn-greet-msg-title").innerText = pick.t;
    document.getElementById("pmkn-greet-msg-desc").innerText = pick.d;

    if (overlay) {
        overlay.style.display = "flex";
        overlay.style.backgroundColor = "#000000"; // Paksa hitam lagi via JS
    }
    
    lockNavigation();
  }

  function pmknUnlockSystem() {
    const overlay = document.getElementById("pmkn-greet-overlay");
    isLocked = false;
    
    // Kembalikan kursor dan scroll
    document.body.classList.remove('locked-critical');
    document.body.classList.remove('shake-screen');
    
    // Keluar dari Fullscreen
    if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
    }

    clearInterval(logInterval);
    clearInterval(matrixInterval);
    document.querySelectorAll('.fake-log-line').forEach(l => l.remove());

    if (overlay) {
      overlay.style.transition = "opacity 0.5s ease";
      overlay.style.opacity = "0";
      setTimeout(() => {
        overlay.style.display = "none";
        overlay.style.opacity = "1";
      }, 500);
    }
  }
</script>
  </body>
</html>
